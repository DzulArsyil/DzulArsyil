<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="title desc">
<title id="title">DzulArsyil contribution flow</title>
<desc id="desc">Animated GitHub contribution activity visualization. This file is refreshed automatically by GitHub Actions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#42a5f5" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#42a5f5"/>
    <stop offset="1" stop-color="#42a5f5" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .cell{rx:3;ry:3;animation:pulse 3.6s ease-in-out infinite}
    .cell:nth-of-type(2n){animation-delay:.25s}.cell:nth-of-type(3n){animation-delay:.6s}.cell:nth-of-type(5n){animation-delay:1s}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{0%{transform:translateX(-180px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1380px);opacity:0}}
    .flow{stroke-dasharray:10 14;animation:flow 2.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-48}}
  </style>
</defs>
<rect width="1200" height="250" rx="18" fill="url(#bg)"/>
<text x="48" y="48" fill="#f0f6fc" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="700">Development Pulse</text>
<text x="48" y="74" fill="#8b949e" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">Contribution activity · refreshed automatically from GitHub</text>
<path class="flow" d="M45 112 C250 90 360 165 570 128 S900 88 1155 130" fill="none" stroke="url(#line)" stroke-width="2" opacity=".8"/>
<g transform="translate(48 145)">
  <rect class="cell" width="14" height="14" fill="#21262d"/><rect class="cell" x="20" width="14" height="14" fill="#0e4429"/><rect class="cell" x="40" width="14" height="14" fill="#006d32"/><rect class="cell" x="60" width="14" height="14" fill="#26a641"/><rect class="cell" x="80" width="14" height="14" fill="#39d353"/>
  <rect class="cell" x="110" width="14" height="14" fill="#0e4429"/><rect class="cell" x="130" width="14" height="14" fill="#006d32"/><rect class="cell" x="150" width="14" height="14" fill="#26a641"/><rect class="cell" x="170" width="14" height="14" fill="#39d353"/><rect class="cell" x="190" width="14" height="14" fill="#21262d"/>
  <rect class="cell" x="220" width="14" height="14" fill="#006d32"/><rect class="cell" x="240" width="14" height="14" fill="#26a641"/><rect class="cell" x="260" width="14" height="14" fill="#39d353"/><rect class="cell" x="280" width="14" height="14" fill="#0e4429"/><rect class="cell" x="300" width="14" height="14" fill="#006d32"/>
  <rect class="cell" x="330" width="14" height="14" fill="#26a641"/><rect class="cell" x="350" width="14" height="14" fill="#39d353"/><rect class="cell" x="370" width="14" height="14" fill="#0e4429"/><rect class="cell" x="390" width="14" height="14" fill="#006d32"/><rect class="cell" x="410" width="14" height="14" fill="#26a641"/>
  <rect class="cell" x="440" width="14" height="14" fill="#39d353"/><rect class="cell" x="460" width="14" height="14" fill="#0e4429"/><rect class="cell" x="480" width="14" height="14" fill="#006d32"/><rect class="cell" x="500" width="14" height="14" fill="#26a641"/><rect class="cell" x="520" width="14" height="14" fill="#39d353"/>
  <rect class="cell" x="550" width="14" height="14" fill="#0e4429"/><rect class="cell" x="570" width="14" height="14" fill="#006d32"/><rect class="cell" x="590" width="14" height="14" fill="#26a641"/><rect class="cell" x="610" width="14" height="14" fill="#39d353"/><rect class="cell" x="630" width="14" height="14" fill="#21262d"/>
  <rect class="cell" x="660" width="14" height="14" fill="#006d32"/><rect class="cell" x="680" width="14" height="14" fill="#26a641"/><rect class="cell" x="700" width="14" height="14" fill="#39d353"/><rect class="cell" x="720" width="14" height="14" fill="#0e4429"/><rect class="cell" x="740" width="14" height="14" fill="#006d32"/>
  <rect class="cell" x="770" width="14" height="14" fill="#26a641"/><rect class="cell" x="790" width="14" height="14" fill="#39d353"/><rect class="cell" x="810" width="14" height="14" fill="#0e4429"/><rect class="cell" x="830" width="14" height="14" fill="#006d32"/><rect class="cell" x="850" width="14" height="14" fill="#26a641"/>
  <rect class="cell" x="880" width="14" height="14" fill="#39d353"/><rect class="cell" x="900" width="14" height="14" fill="#0e4429"/><rect class="cell" x="920" width="14" height="14" fill="#006d32"/><rect class="cell" x="940" width="14" height="14" fill="#26a641"/><rect class="cell" x="960" width="14" height="14" fill="#39d353"/>
  <rect class="cell" x="990" width="14" height="14" fill="#21262d"/><rect class="cell" x="1010" width="14" height="14" fill="#006d32"/><rect class="cell" x="1030" width="14" height="14" fill="#26a641"/><rect class="cell" x="1050" width="14" height="14" fill="#39d353"/><rect class="cell" x="1070" width="14" height="14" fill="#0e4429"/>
</g>
<g class="scan" filter="url(#glow)"><circle cx="45" cy="112" r="5" fill="#42a5f5"/><circle cx="45" cy="112" r="12" fill="none" stroke="#42a5f5" opacity=".35"/></g>
<text x="48" y="205" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">DESIGN  ×  CODE  ×  CONSISTENCY</text>
<text x="1152" y="205" text-anchor="end" fill="#42a5f5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">LIVE / AUTO</text>
</svg>
