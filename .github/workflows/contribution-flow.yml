name: Update Contribution Flow

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}","variables":{"login":"DzulArsyil"}}' \
            https://api.github.com/graphql > /tmp/contributions.json

      - name: Generate animated SVG
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          data = json.loads(Path('/tmp/contributions.json').read_text())
          days = [d for w in data['data']['user']['contributionsCollection']['contributionCalendar']['weeks'] for d in w['contributionDays']]
          total = data['data']['user']['contributionsCollection']['contributionCalendar']['totalContributions']
          days = days[-105:]
          max_count = max([d['contributionCount'] for d in days] or [1])

          def level(n):
              if n == 0: return '#161b22'
              r = n / max_count
              if r < .25: return '#0e4429'
              if r < .5: return '#006d32'
              if r < .75: return '#26a641'
              return '#39d353'

          cells = []
          for i, day in enumerate(days):
              x = 48 + (i % 35) * 31
              y = 118 + (i // 35) * 31
              delay = (i % 35) * .035
              cells.append(f'<rect class="cell" x="{x}" y="{y}" width="22" height="22" rx="5" fill="{level(day["contributionCount"])}" style="animation-delay:{delay:.2f}s"><title>{day["date"]}: {day["contributionCount"]} contributions</title></rect>')

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-labelledby="title desc">
          <title id="title">DzulArsyil Development Pulse</title>
          <desc id="desc">Animated visualization of the latest GitHub contribution activity. {total} contributions in the current contribution calendar.</desc>
          <defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#42a5f5" stop-opacity="0"/><stop offset=".5" stop-color="#42a5f5"/><stop offset="1" stop-color="#42a5f5" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <style>.cell{{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}@keyframes pulse{{0%,100%{{opacity:.45;transform:scale(1)}}50%{{opacity:1;transform:scale(1.12)}}}}.scan{{animation:scan 5s linear infinite}}@keyframes scan{{0%{{transform:translateX(-100px);opacity:0}}10%{{opacity:1}}90%{{opacity:1}}100%{{transform:translateX(1200px);opacity:0}}}}.flow{{stroke-dasharray:9 13;animation:dash 2s linear infinite}}@keyframes dash{{to{{stroke-dashoffset:-44}}}}</style>
          <rect width="1200" height="270" rx="20" fill="#0d1117"/>
          <text x="48" y="43" fill="#f0f6fc" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="700">Development Pulse</text>
          <text x="48" y="67" fill="#8b949e" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">GitHub contribution activity · {total} contributions · auto-generated</text>
          <path class="flow" d="M48 101 C280 78 420 135 600 105 S930 78 1152 108" fill="none" stroke="url(#line)" stroke-width="2" opacity=".8"/>
          {''.join(cells)}
          <g class="scan" filter="url(#glow)"><circle cx="48" cy="101" r="5" fill="#42a5f5"/><circle cx="48" cy="101" r="13" fill="none" stroke="#42a5f5" opacity=".35"/></g>
          <text x="48" y="258" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">DESIGN × CODE × CONSISTENCY</text>
          <text x="1152" y="258" text-anchor="end" fill="#42a5f5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">LIVE / AUTO</text>
          </svg>'''
          Path('assets/contribution-flow.svg').write_text(svg)
          PY

      - name: Commit updated asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contribution-flow.svg
          git diff --cached --quiet || git commit -m "chore: update contribution flow"
          git push
