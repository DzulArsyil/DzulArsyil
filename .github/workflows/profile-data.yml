name: Update Profile Data

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile cards from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token=os.environ['GH_TOKEN']; user=os.environ['USERNAME']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'profile-generator'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          profile=get(f'https://api.github.com/users/{user}')
          repos=[]
          for page in range(1,11):
              batch=get(f'https://api.github.com/users/{user}/repos?per_page=100&page={page}&type=owner')
              repos+=batch
              if len(batch)<100: break
          repos=[r for r in repos if not r.get('fork')]
          stars=sum(r.get('stargazers_count',0) for r in repos)
          forks=sum(r.get('forks_count',0) for r in repos)
          langs={}
          for r in repos:
              try:
                  for k,v in get(r['languages_url']).items(): langs[k]=langs.get(k,0)+v
              except Exception: pass
          top=sorted(langs.items(),key=lambda x:x[1],reverse=True)[:6]
          total=sum(langs.values()) or 1
          out=Path('assets'); out.mkdir(exist_ok=True)
          def esc(s): return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
          def svg(title,desc,body,w=620,h=230):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {w} {h}" width="{w}" height="{h}" role="img"><title>{esc(title)}</title><desc>{esc(desc)}</desc><defs><linearGradient id="g"><stop stop-color="#42a5f5"/><stop offset="1" stop-color="#7c4dff"/></linearGradient></defs><style>text{{font-family:system-ui,-apple-system,Segoe UI,sans-serif}}.m{{animation:p 3s ease-in-out infinite}}@keyframes p{{0%,100%{{opacity:.7}}50%{{opacity:1}}}}</style><rect width="100%" height="100%" rx="18" fill="#0d1117" stroke="#30363d"/><text x="30" y="38" fill="#f0f6fc" font-size="21" font-weight="700">{esc(title)}</text><text x="30" y="60" fill="#8b949e" font-size="11">{esc(desc)}</text>{body}</svg>'''
          metrics=[('Repositories',profile['public_repos']),('Followers',profile['followers']),('Stars',stars),('Forks',forks)]
          body=''
          for i,(label,val) in enumerate(metrics):
              x=30+(i%2)*285;y=94+(i//2)*62
              body+=f'<g class="m"><text x="{x}" y="{y}" fill="#42a5f5" font-size="25" font-weight="800">{val}</text><text x="{x}" y="{y+21}" fill="#c9d1d9" font-size="12">{esc(label)}</text></g>'
          out.joinpath('github-stats.svg').write_text(svg('Development Pulse','Live metrics · generated from GitHub API',body))
          body=''
          for i,(name,val) in enumerate(top):
              pct=val/total*100; y=94+i*21
              width=330*pct/100
              body+=f'<text x="30" y="{y}" fill="#c9d1d9" font-size="11">{esc(name)}</text><rect x="125" y="{y-9}" width="330" height="8" rx="4" fill="#21262d"/><rect x="125" y="{y-9}" width="{width:.1f}" height="8" rx="4" fill="url(#g)"/><text x="470" y="{y}" fill="#8b949e" font-size="10">{pct:.1f}%</text>'
          out.joinpath('top-langs.svg').write_text(svg('Most Used Languages','Owned repositories · aggregated language bytes',body))
          body=''
          for i,(label,val) in enumerate(metrics):
              x=20+i*150
              body+=f'<g class="m"><rect x="{x}" y="94" width="130" height="86" rx="12" fill="#161b22" stroke="#30363d"/><text x="{x+65}" y="128" text-anchor="middle" fill="#42a5f5" font-size="23" font-weight="800">{val}</text><text x="{x+65}" y="151" text-anchor="middle" fill="#c9d1d9" font-size="9">{esc(label.upper())}</text><text x="{x+65}" y="167" text-anchor="middle" fill="#8b949e" font-size="8">LIVE DATA</text></g>'
          out.joinpath('achievements.svg').write_text(svg('Achievement Board','Verified public GitHub metrics · auto-updated',body,620,220))
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/achievements.svg
          git diff --cached --quiet || git commit -m "chore: update profile metrics"
          git push
