name: Update Profile Data

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile cards from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          user = os.environ['USERNAME']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'github-profile-action'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          profile = get(f'https://api.github.com/users/{user}')
          repos = []
          page = 1
          while page <= 10:
              batch = get(f'https://api.github.com/users/{user}/repos?per_page=100&page={page}&type=owner')
              repos.extend(batch)
              if len(batch) < 100: break
              page += 1

          stars = sum(r.get('stargazers_count', 0) for r in repos)
          forks = sum(r.get('forks_count', 0) for r in repos)
          original_repos = [r for r in repos if not r.get('fork', False)]

          # Aggregate language bytes from owned repositories.
          lang_bytes = {}
          for repo in original_repos:
              try:
                  langs = get(repo['languages_url'])
                  for name, value in langs.items():
                      lang_bytes[name] = lang_bytes.get(name, 0) + value
              except Exception:
                  pass
          top = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)[:6]
          total_bytes = sum(lang_bytes.values()) or 1

          out = Path('assets'); out.mkdir(exist_ok=True)
          esc = lambda s: str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')

          def svg_card(title, subtitle, body):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-labelledby="t d"><title id="t">{esc(title)}</title><desc id="d">{esc(subtitle)}</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#42a5f5"/><stop offset="1" stop-color="#7c4dff"/></linearGradient></defs><style>text{{font-family:system-ui,-apple-system,Segoe UI,sans-serif}}.metric{{animation:p 3s ease-in-out infinite}}@keyframes p{{0%,100%{{opacity:.75}}50%{{opacity:1}}}}</style><rect width="620" height="230" rx="18" fill="#0d1117" stroke="#30363d"/><text x="32" y="40" fill="#f0f6fc" font-size="22" font-weight="700">{esc(title)}</text><text x="32" y="64" fill="#8b949e" font-size="12">{esc(subtitle)}</text>{body}</svg>'''

          body = ''
          metrics = [('Repositories', profile['public_repos']), ('Followers', profile['followers']), ('Stars', stars), ('Forks', forks)]
          for i,(label,value) in enumerate(metrics):
              x = 32 + (i%2)*290; y = 92 + (i//2)*62
              body += f'<g class="metric"><text x="{x}" y="{y}" fill="#42a5f5" font-size="25" font-weight="800">{value}</text><text x="{x}" y="{y+22}" fill="#c9d1d9" font-size="12">{esc(label)}</text></g>'
          out.joinpath('github-stats.svg').write_text(svg_card('Development Pulse','Live profile metrics · generated from GitHub API',body))

          bars = ''
          for i,(name,val) in enumerate(top):
              pct = val/total_bytes*100
              y = 96+i*20
              bars += f'<text x="32" y="{y}" fill="#c9d1d9" font-size="12">{esc(name)}</text><rect x="140" y="{y-11}" width="330" height="9" rx="4" fill="#21262d"/><rect x="140" y="{y-11}" width="{330*pct/100:.1f}" height="9" rx="4" fill="url(#g)"/><text x="490" y="{y}" fill="#8b949e" font-size="11">{pct:.1f}%</text>'
          out.joinpath('top-langs.svg').write_text(svg_card('Most Used Languages','Owned repositories · aggregated language bytes',bars))

          # A locally generated achievement board, avoiding an external image endpoint.
          achievements = [('PUBLIC REPOS', profile['public_repos']), ('FOLLOWERS', profile['followers']), ('STARS EARNED', stars), ('FORKS', forks)]
          items = ''
          for i,(label,value) in enumerate(achievements):
              x = 24+i*150
              items += f'<g class="metric"><rect x="{x}" y="95" width="130" height="82" rx="12" fill="#161b22" stroke="#30363d"/><text x="{x+65}" y="128" text-anchor="middle" fill="#42a5f5" font-size="23" font-weight="800">{value}</text><text x="{x+65}" y="151" text-anchor="middle" fill="#c9d1d9" font-size="9">{esc(label)}</text><text x="{x+65}" y="166" text-anchor="middle" fill="#8b949e" font-size="9">VERIFIED</text></g>'
          out.joinpath('achievements.svg').write_text(svg_card('Achievement Board','Automatically updated · based on public GitHub data',items))
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/achievements.svg
          git diff --cached --quiet || git commit -m "chore: update profile metrics"
          git push
